version: '3.8'

services:
  # Service 1: PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: poke-postgres
    restart: always
    environment:
      POSTGRES_DB: pokearena
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD:
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Service 2: PokeArena Spring Boot App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: poke-arena-app
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy # Waits until Postgres is completely ready!
    ports:
      - "8088:8088"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pokearena
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

volumes:
  postgres_data: